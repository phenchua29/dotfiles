GOOSE_TELEMETRY_ENABLED: false
extensions:
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  code_execution:
    enabled: true
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
GOOSE_THINKING_EFFORT: high
GOOSE_CONTEXT_LIMIT: 1000000
active_provider: custom_opencode_zen
providers:
  openrouter:
    enabled: true
    model: nvidia/nemotron-3-super-120b-a12b:free
    configured: true
  custom_opencode_zen:
    enabled: true
    model: deepseek-v4-flash-free
    configured: true
GOOSE_DISABLE_KEYRING: ''
GOOSE_MODE: smart_approve
GOOSE_MOIM_MESSAGE_TEXT: |
  Critical guardrails:
  - Never read files that may contain secrets. Ask for permission or guidance if it's a must.
  - When making technical decisions, do not give much weight to development cost. Instead, prefer quality, simplicity, robustness, scalability, and long term maintainability.
  - When doing bug fixes, always start with reproducing the bug in an E2E setting as closely aligned with how an end user would experience it.
  - When end-to-end testing a product, be picky about the UI and be obsessed with pixel perfection.
  - Apply a high standard to engineering excellence: lint, test failures, and test flakiness. If you see one, get it fixed.
GOOSE_NO_CODE_TRUNCATION: true
GOOSE_SHOW_FULL_OUTPUT: true
SECURITY_PROMPT_ENABLED: true
SECURITY_PROMPT_THRESHOLD: 1.0
GOOSE_CLI_THEME: dark
